name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: plugin
          # Private repo, not submitted to the HACS default store, so skip the
          # store-readiness checks (repo description/topics, README images, and
          # the stricter store hacs.json manifest check).
          ignore: brands wheels description topics images hacsjson
